<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title> Login - Aprender+</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css"> 


 <style>
    *{ 
        box-sizing: border-box;
    }

    body{
        margin: 0;
        min-height: 200vh;
        background: #111a2e;
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

    }
    <!---->
    .login {

        width: 700px;
        padding: 60px 20px;
        background-color: #071226;
        border: 2px solid #a10b76;
        border-radius: 40px;
        text-align: center;
    }

    <!---->
    .login h1 { 

        color: white;
        font-size: 44px;
        margin: 0 0 15px;

    }

    .login p{
        color: #d8d8df;
        font-size: 20px;
        margin-bottom: 40px;
    }


    .login input {

        width: 100%;
        padding: 10px 28px;
        margin-bottom: 22px;


        background:  #141e34;
        border: 1px solid #910a68;
        border-radius: 16px;


        color: white;
        font-size: 14px;
        
    }
     
    .login input::placeholder {
         
        color: #aaa;
    }
    
     <!--cor e tamanho do botao entrar-->
    .login button {
        width: 40%;
        padding: 6px;


        border: none;
        border-radius: 18px;


        background:  linear-gradient(90deg, #e83f9d, #8549eb);
        color: white;

        font-size: px;
        font-weight: bold;
        cursor: pointer;
    }



    .login a {
        color: #ec3d9d;
        text-decoration: none;

    }
    </style>
</head>



<body>  
         
        <div class="login">
            <h1>Acessar conta</h1>

            <p>Entre com suas credenciais para continuar</p>

            <input type="email" placeholder="E-mail">
            <input type="password" placeholder="senha">

            <button>ENTRAR</button>
        </div>


   



    <script src="script.js"></script>
</body>

</html>
